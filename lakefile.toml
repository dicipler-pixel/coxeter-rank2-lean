name = "coxeter-rank2-lean"
version = "1.0.0"
defaultTargets = ["CoxeterRankTwo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# Module names and bytes are kept as first checked (see PROVENANCE.md).
[[lean_lib]]
name = "CoxeterRankTwo"
# RankTwoTargets is imported by RankTwoClassification; Lake builds only modules listed in
# roots, so an imported-but-unlisted module fails the build with "unknown module prefix".
roots = ["RankTwoTargets", "RankTwoCertificate", "DihedralBridge", "RankTwoClassification"]
